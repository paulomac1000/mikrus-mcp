behavior:
  preserved:
    - "Named server-administration reads and targeted administration workflows remain available through the official MCP SDK."
    - "Configured target identifiers remain explicit and stable across discovery and invocation."
    - "Both stdio and HTTP clients receive structured operation results and controlled errors."
  intentionally_changed:
    - "Legacy two-endpoint HTTP plus SSE and the unauthenticated REST bridge are superseded by stateless loopback Streamable HTTP with bearer authentication."
    - "Default-target failure no longer falls back to another target."
    - "SSH mutation approval binds the verified host-key fingerprint in addition to the configured selector."
    - "Mutations require operator write enablement, authorization scopes and one-time server-side approval."
    - "Mutation execution starts only with enough remaining deadline for phase-aware adapter classification; pre-execution timeout preserves the approval while post-start expiry is an ambiguous outcome."
    - "Mixed-risk legacy service and process operations are split into read and mutation capabilities; general-purpose raw command execution is not exposed."
    - "Remote writes use component-aware no-follow directory traversal and atomic commit."
  removed_legacy:
    - "Deprecated HTTP plus SSE transport."
    - "Unauthenticated REST bridge."
    - "Automatic target fallback."
    - "Model-visible approval token inputs."
    - "General-purpose execute_command capability."
