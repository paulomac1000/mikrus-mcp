repos:
  - repo: local
    hooks:
      - id: docs-contract
        name: documentation contract
        entry: python scripts/check_docs.py
        language: system
        pass_filenames: false
      - id: ruff-check
        name: ruff check
        entry: python -m ruff check src tests scripts
        language: system
        types: [python]
        pass_filenames: false
      - id: ruff-format
        name: ruff format check
        entry: python -m ruff format --check src tests scripts
        language: system
        types: [python]
        pass_filenames: false
      - id: focused-tests
        name: credential-free tests
        entry: python -m pytest tests/unit tests/smoke -q
        language: system
        pass_filenames: false
