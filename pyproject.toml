[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mikrus-mcp"
version = "2.0.0"
description = "Hardened MCP server for mikr.us API and SSH-managed Linux servers"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Pawel Maciejewski"}]
keywords = ["mcp", "mikrus", "vps", "ssh", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "mcp==2.0.0",
    "httpx==0.28.1",
    "asyncssh==2.24.0",
    "uvicorn==0.51.0",
]

[project.urls]
Homepage = "https://github.com/paulomac1000/mikrus-mcp"
Repository = "https://github.com/paulomac1000/mikrus-mcp"

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.0",
    "mypy==2.3.0",
    "bandit==1.9.4",
    "pip-audit==2.10.1",
    "build==1.5.1",
    "PyYAML==6.0.3",
]

[project.scripts]
mikrus-mcp = "mikrus_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S105", "S106"]
"scripts/**" = ["S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "unit: deterministic unit tests with no external I/O",
  "smoke: application-level tests with mocked backends",
  "real_backend: requires a real mikr.us or SSH target",
  "artifact: tests the exact built wheel or container",
]
