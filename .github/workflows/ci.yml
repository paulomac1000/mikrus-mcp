name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_VERSION: "26.1.2"
  AI_SKILLS_REVISION: "fdb46268454bf08258e39e604e0ab7f764b54c7a"

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-runtime.in
            requirements-dev.in
      - name: Build and install the exact wheel with development tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "pip==$PIP_VERSION"
          python -m pip install -r requirements-dev.in
          python -m build --wheel --no-isolation
          python -m pip install --no-deps dist/mikrus_mcp-*.whl
          python -m pip check
      - name: Run complete quality gate
        run: python scripts/ci.py
      - name: Checkout immutable AI Skills authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: paulomac1000/ai-skills
          ref: ${{ env.AI_SKILLS_REVISION }}
          path: .trusted-ai-skills
          persist-credentials: false
      - name: Validate immutable AI Skills consumer lock
        run: >-
          python .trusted-ai-skills/contracts/validate_skills_lock.py
          ai-skills.lock.yaml --skills-root .trusted-ai-skills
      - name: Validate canonical capability projections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import sys
          from pathlib import Path
          from jsonschema import Draft202012Validator
          from mikrus_mcp.manifests import MANIFESTS

          contracts = Path(".trusted-ai-skills/contracts")
          sys.path.insert(0, str(contracts))
          from validate_capability_manifest import _semantic_findings

          schema = json.loads((contracts / "capability-manifest.schema.json").read_text())
          Draft202012Validator.check_schema(schema)
          validator = Draft202012Validator(schema)
          findings = []
          for name, manifest in sorted(MANIFESTS.items()):
              projection = manifest.as_dict()
              for error in validator.iter_errors(projection):
                  findings.append(f"{name}: {error.message}")
              findings.extend(f"{name}: {item}" for item in _semantic_findings(projection))
          if findings:
              raise SystemExit("\n".join(findings))
          print(f"validated {len(MANIFESTS)} canonical capability manifests")
          PY
      - name: Validate governed documentation with pinned AFDS
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t governed < <(python scripts/check_docs.py --print-governed)
          test "${#governed[@]}" -gt 0
          python .trusted-ai-skills/skills/afds-doc-writer/validate.py \
            --minimum-document-schema 2 "${governed[@]}"
      - name: Audit pull-request workflow with pinned policy authority
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .policy-input/.github/workflows
          cp .github/workflows/ci.yml .policy-input/.github/workflows/ci.yml
          python .trusted-ai-skills/skills/ci-cd-architect/tools/check_github_actions_policy.py .policy-input
      - name: Audit repository workflow privilege profiles
        run: python scripts/check_workflows.py
      - name: Upload quality diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: quality-diagnostics-${{ github.run_id }}
          path: |
            repository-junit.xml
            coverage.xml
          if-no-files-found: warn
          retention-days: 30

  compatibility:
    name: Python compatibility (${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-runtime.in
            requirements-dev.in
      - name: Build exact wheel and run credential-free suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "pip==$PIP_VERSION"
          python -m pip install -r requirements-dev.in
          python -m build --wheel --no-isolation
          python -m pip install --no-deps dist/mikrus_mcp-*.whl
          python -m pip check
          python scripts/core_gate.py

  lock-evidence:
    name: Platform locks (linux-x64-py${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - name: Compile, download, bind and install exact platform artifacts
        shell: bash
        env:
          PYTHON_VERSION: ${{ matrix.python }}
        run: |
          set -euo pipefail
          python -m pip install "pip==$PIP_VERSION" "pip-tools==7.6.0"
          lock_id="linux-x64-py${PYTHON_VERSION//./}"
          mkdir -p compiled lock-output runtime-wheelhouse dev-wheelhouse
          python -m piptools compile \
            --allow-unsafe \
            --generate-hashes \
            --strip-extras \
            --output-file="compiled/runtime.lock" \
            requirements-runtime.in
          python -m piptools compile \
            --allow-unsafe \
            --generate-hashes \
            --strip-extras \
            --output-file="compiled/dev.lock" \
            requirements-dev.in
          python -m pip download --only-binary=:all: --require-hashes \
            --dest runtime-wheelhouse -r compiled/runtime.lock
          python -m pip download --only-binary=:all: --require-hashes \
            --dest dev-wheelhouse -r compiled/dev.lock
          python scripts/build_platform_lock.py \
            --wheelhouse runtime-wheelhouse \
            --python-version "$PYTHON_VERSION" \
            --source requirements-runtime.in \
            --output "lock-output/requirements-runtime-$lock_id.lock"
          python scripts/build_platform_lock.py \
            --wheelhouse dev-wheelhouse \
            --python-version "$PYTHON_VERSION" \
            --source requirements-dev.in \
            --output "lock-output/requirements-dev-$lock_id.lock"
          python -m venv .lock-runtime
          python -m pip --python .lock-runtime/bin/python install \
            --no-index --find-links=runtime-wheelhouse --only-binary=:all: --require-hashes \
            -r "lock-output/requirements-runtime-$lock_id.lock"
          .lock-runtime/bin/python -m pip check
          python -m venv .lock-dev
          python -m pip --python .lock-dev/bin/python install \
            --no-index --find-links=dev-wheelhouse --only-binary=:all: --require-hashes \
            -r "lock-output/requirements-dev-$lock_id.lock"
          .lock-dev/bin/python -m pip check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: platform-locks-python-${{ matrix.python }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: lock-output/
          if-no-files-found: error
          retention-days: 7

  exact-wheel:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-runtime-linux-x64-py312.lock
      - name: Build exact application wheel and locked dependency wheelhouse
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "pip==$PIP_VERSION" "build==1.5.1" \
            "setuptools==83.0.0" "wheel==0.47.0"
          python -m build --wheel --no-isolation
          mkdir -p wheelhouse
          python -m pip download \
            --only-binary=:all: \
            --require-hashes \
            --dest wheelhouse \
            -r requirements-runtime-linux-x64-py312.lock
          cp dist/mikrus_mcp-*.whl wheelhouse/
      - name: Smoke exact wheel through real advertised transports
        shell: bash
        run: |
          set -euo pipefail
          python scripts/artifact_smoke.py \
            --wheel "$(find dist -maxdepth 1 -name 'mikrus_mcp-*.whl' -print -quit)" \
            --wheelhouse wheelhouse
      - name: Record wheel digests and source revision
        shell: bash
        run: |
          set -euo pipefail
          sha256sum dist/*.whl wheelhouse/*.whl > wheel-digests.txt
          printf '%s\n' "${{ github.event.pull_request.head.sha || github.sha }}" > commit-sha.txt
      - name: Upload exact wheel and wheelhouse
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: exact-wheel-${{ github.run_id }}
          path: |
            dist/*.whl
            wheelhouse/*.whl
            wheel-digests.txt
            commit-sha.txt
          if-no-files-found: error
          retention-days: 30

  container:
    needs: exact-wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: exact-wheel-${{ github.run_id }}
          path: .
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5
      - name: Verify wheel bundle revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat commit-sha.txt)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          sha256sum --check wheel-digests.txt
      - name: Build image once from the exact verified wheel
        shell: bash
        run: |
          set -euo pipefail
          app_wheel="$(find wheelhouse -maxdepth 1 -name 'mikrus_mcp-*.whl' -print -quit)"
          app_sha="$(sha256sum "$app_wheel" | cut -d' ' -f1)"
          docker buildx build --load --platform linux/amd64 \
            --build-arg "APP_WHEEL_SHA256=$app_sha" \
            --tag "mikrus-mcp:${{ github.event.pull_request.head.sha || github.sha }}" .
      - name: Smoke MCP invocation and export the exact image
        shell: bash
        run: |
          set -euo pipefail
          image="mikrus-mcp:${{ github.event.pull_request.head.sha || github.sha }}"
          docker run --rm --entrypoint python "$image" -c \
            "import os; from mikrus_mcp import __version__; assert __version__ == '2.0.0'; assert os.getuid() == 10001"
          python -m venv .container-smoke
          .container-smoke/bin/python -m pip install --no-index --find-links=wheelhouse "mcp==2.0.0"
          .container-smoke/bin/python scripts/container_smoke.py --image "$image"
          mkdir -p release
          docker image inspect --format='{{.Id}}' "$image" > release/image-id.txt
          docker save --output release/image.tar "$image"
          cp commit-sha.txt release/commit-sha.txt
          sha256sum release/image.tar dist/*.whl wheelhouse/*.whl > release/bundle-sha256.txt
      - name: Upload immutable release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-bundle-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            release/
            dist/*.whl
            wheelhouse/*.whl
            wheel-digests.txt
          if-no-files-found: error
          retention-days: 30
