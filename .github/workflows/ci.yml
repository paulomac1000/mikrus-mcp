name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-runtime.in
            requirements-dev.in
      - name: Install development environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "pip==25.2"
          python -m pip install ".[dev]"
      - name: Run complete local gate
        run: python scripts/ci.py
      - name: Checkout immutable AI Skills authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: paulomac1000/ai-skills
          ref: 661ff01a5e70d58d6c94a12545b24647e52063ed
          path: .trusted-ai-skills
          persist-credentials: false
      - name: Validate governed documentation with pinned AFDS
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t governed < <(python scripts/check_docs.py --print-governed)
          test "${#governed[@]}" -gt 0
          python .trusted-ai-skills/skills/afds-doc-writer/validate.py "${governed[@]}"
      - name: Audit workflows with pinned policy authority
        run: >-
          python .trusted-ai-skills/skills/ci-cd-architect/tools/check_github_actions_policy.py .
      - name: Upload quality diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: quality-diagnostics-${{ github.run_id }}
          path: |
            repository-junit.xml
            coverage.xml
          if-no-files-found: error
          retention-days: 30

  compatibility:
    name: Python compatibility (${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install and run credential-free suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "pip==25.2"
          python -m pip install ".[dev]"
          python scripts/core_gate.py

  exact-wheel:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build exact application wheel and dependency wheelhouse
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "pip==25.2" "build==1.3.0"
          python -m build --wheel
          mkdir -p wheelhouse
          python -m pip wheel --wheel-dir wheelhouse \
            "mcp==2.0.0" "httpx==0.28.1" "asyncssh==2.24.0" "uvicorn==0.51.0"
          cp dist/mikrus_mcp-*.whl wheelhouse/
      - name: Smoke exact wheel through official MCP client
        shell: bash
        run: |
          set -euo pipefail
          python scripts/artifact_smoke.py \
            --wheel "$(find dist -maxdepth 1 -name 'mikrus_mcp-*.whl' -print -quit)" \
            --wheelhouse wheelhouse
      - name: Record wheel digests
        shell: bash
        run: |
          set -euo pipefail
          sha256sum dist/*.whl wheelhouse/*.whl > wheel-digests.txt
      - name: Upload exact wheel and wheelhouse
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: exact-wheel-${{ github.run_id }}
          path: |
            dist/*.whl
            wheelhouse/*.whl
            wheel-digests.txt
          if-no-files-found: error
          retention-days: 30

  container:
    needs: exact-wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: exact-wheel-${{ github.run_id }}
          path: .
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5
      - name: Build image from the exact wheelhouse
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: .
          load: true
          push: false
          tags: mikrus-mcp:${{ github.sha }}
      - name: Smoke non-root image without backend I/O
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint python mikrus-mcp:${{ github.sha }} -c \
            "import os; from mikrus_mcp import __version__; assert __version__ == '2.0.0'; assert os.getuid() == 10001"
