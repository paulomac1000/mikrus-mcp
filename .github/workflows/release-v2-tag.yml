name: Tag v2.0.0 release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  actions: write
  contents: write

concurrency:
  group: release-v2.0.0-tag
  cancel-in-progress: false

jobs:
  tag:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Ensure v2.0.0 tag and dispatch publisher
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          current_master="$(gh api "/repos/$GITHUB_REPOSITORY/commits/master" --jq .sha)"
          if [[ "$current_master" != "$RELEASE_SHA" ]]; then
            echo "Skipping stale CI revision $RELEASE_SHA; master is $current_master"
            exit 0
          fi

          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [[ "$version" != "2.0.0" ]]; then
            echo "Skipping because project version is $version, expected 2.0.0"
            exit 0
          fi
          python scripts/check_evidence_freshness.py

          if gh api "/repos/$GITHUB_REPOSITORY/git/ref/tags/v2.0.0" >/dev/null 2>&1; then
            tagged_sha="$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/tags/v2.0.0" --jq .object.sha)"
            git cat-file -e "$tagged_sha^{commit}"
            git merge-base --is-ancestor "$tagged_sha" "$RELEASE_SHA" || {
              echo "Existing v2.0.0 tag $tagged_sha is not an ancestor of current master $RELEASE_SHA" >&2
              exit 1
            }
            git show "$tagged_sha:pyproject.toml" > /tmp/v2-pyproject.toml
            tagged_version="$(python -c 'import tomllib; print(tomllib.load(open("/tmp/v2-pyproject.toml", "rb"))["project"]["version"])')"
            test "$tagged_version" = "2.0.0"
            echo "Using existing v2.0.0 tag at $tagged_sha"
          else
            tagged_sha="$RELEASE_SHA"
            gh api --method POST "/repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref='refs/tags/v2.0.0' \
              -f sha="$tagged_sha"
            echo "Created v2.0.0 at $tagged_sha"
          fi

          if gh release view v2.0.0 >/dev/null 2>&1; then
            echo "GitHub Release v2.0.0 already exists; publisher does not need redispatch"
            exit 0
          fi

          gh api --method POST "/repos/$GITHUB_REPOSITORY/actions/workflows/publish.yml/dispatches" \
            --input - <<'JSON'
          {"ref":"master","inputs":{"release_ref":"v2.0.0"}}
          JSON
          echo "Dispatched publish.yml for v2.0.0"
