name: Publish container

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_ref:
        description: Existing v* tag or full 40-character commit SHA reachable from the default branch
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.ref }}
  cancel-in-progress: false

jobs:
  validate-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
      version: ${{ steps.revision.outputs.version }}
      release_tag: ${{ steps.revision.outputs.release_tag }}
      quarantine_ref: ${{ steps.quarantine.outputs.ref }}
      quarantine_digest: ${{ steps.quarantine.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve and constrain release identity
        id: revision
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF_NAME: ${{ github.ref_name }}
          REQUESTED_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.ref }}
        run: |
          set -euo pipefail
          requested="$REQUESTED_REF"
          release_tag=""
          if [[ "$EVENT_NAME" == "push" ]]; then
            release_tag="$EVENT_REF_NAME"
            requested="refs/tags/$release_tag"
          fi
          if [[ "$requested" =~ ^[0-9a-f]{40}$ ]]; then
            release_sha="$requested"
          else
            case "$requested" in
              refs/tags/v*) release_tag="${requested#refs/tags/}" ;;
              v*) release_tag="$requested" ;;
              *) echo "release_ref must be an existing v* tag or full commit SHA" >&2; exit 1 ;;
            esac
            git show-ref --verify --quiet "refs/tags/$release_tag" || {
              echo "Tag not found: $release_tag" >&2
              exit 1
            }
            release_sha="$(git rev-parse "refs/tags/$release_tag^{commit}")"
          fi
          [[ "$release_sha" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$release_sha^{commit}"
          git merge-base --is-ancestor "$release_sha" "origin/$DEFAULT_BRANCH" || {
            echo "Selected revision is not reachable from origin/$DEFAULT_BRANCH" >&2
            exit 1
          }
          git checkout --detach "$release_sha"
          test "$(git rev-parse HEAD)" = "$release_sha"
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [[ -n "$release_tag" ]]; then
            test "$release_tag" = "v$version"
            test "$(git rev-parse "refs/tags/$release_tag^{commit}")" = "$release_sha"
          fi
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
      - name: Locate successful CI release bundle
        id: evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.revision.outputs.sha }}
        run: |
          set -euo pipefail
          run_id="$(gh api --paginate \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$RELEASE_SHA&status=success&per_page=100" \
            --jq '.workflow_runs | map(select(.head_sha == env.RELEASE_SHA)) | first | .id')"
          test -n "$run_id" && test "$run_id" != "null"
          artifact_id="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" \
            --jq ".artifacts | map(select(.name == \"release-bundle-$RELEASE_SHA\" and (.expired | not))) | first | .id")"
          test -n "$artifact_id" && test "$artifact_id" != "null"
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
      - name: Download exact CI artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.evidence.outputs.artifact_id }}
        run: |
          set -euo pipefail
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > release-bundle.zip
          mkdir bundle
          unzip -q release-bundle.zip -d bundle
      - name: Verify exact CI bundle and wheel transports
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.revision.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(cat bundle/release/commit-sha.txt)" = "$RELEASE_SHA"
          (cd bundle && sha256sum --check release/bundle-sha256.txt)
          python scripts/artifact_smoke.py \
            --wheel "$(find bundle/dist -maxdepth 1 -name 'mikrus_mcp-*.whl' -print -quit)" \
            --wheelhouse bundle/wheelhouse
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - name: Load and smoke candidate image outside protected publisher
        id: candidate
        shell: bash
        env:
          VERSION: ${{ steps.revision.outputs.version }}
        run: |
          set -euo pipefail
          loaded="$(docker load --input bundle/release/image.tar)"
          source_image="${loaded#Loaded image: }"
          test "$source_image" != "$loaded"
          test "$(docker image inspect --format='{{.Id}}' "$source_image")" = \
            "$(cat bundle/release/image-id.txt)"
          docker run --rm --entrypoint python "$source_image" -c \
            "import os; from mikrus_mcp import __version__; assert __version__ == '$VERSION'; assert os.getuid() == 10001"
          echo "image=$source_image" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ vars.QUARANTINE_REGISTRY }}
          username: ${{ secrets.QUARANTINE_USERNAME }}
          password: ${{ secrets.QUARANTINE_PASSWORD }}
      - name: Push candidate only to isolated quarantine
        id: quarantine
        shell: bash
        env:
          LOCAL_IMAGE: ${{ steps.candidate.outputs.image }}
          RELEASE_SHA: ${{ steps.revision.outputs.sha }}
          QUARANTINE_REGISTRY: ${{ vars.QUARANTINE_REGISTRY }}
          QUARANTINE_REPOSITORY: ${{ vars.QUARANTINE_REPOSITORY }}
        run: |
          set -euo pipefail
          test -n "$QUARANTINE_REGISTRY"
          test -n "$QUARANTINE_REPOSITORY"
          quarantine_ref="$QUARANTINE_REGISTRY/$QUARANTINE_REPOSITORY:sha-$RELEASE_SHA"
          docker tag "$LOCAL_IMAGE" "$quarantine_ref"
          docker push "$quarantine_ref"
          digest="$(docker buildx imagetools inspect "$quarantine_ref" --format '{{.Manifest.Digest}}')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "ref=$quarantine_ref" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Smoke exact quarantined digest
        shell: bash
        env:
          QUARANTINE_REF: ${{ steps.quarantine.outputs.ref }}
          QUARANTINE_DIGEST: ${{ steps.quarantine.outputs.digest }}
        run: |
          set -euo pipefail
          python -m venv .container-smoke
          .container-smoke/bin/python -m pip install --no-index --find-links=bundle/wheelhouse "mcp==2.0.0"
          image="${QUARANTINE_REF%:*}@$QUARANTINE_DIGEST"
          .container-smoke/bin/python scripts/container_smoke.py --image "$image"

  publish:
    needs: validate-release
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: none
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ vars.QUARANTINE_REGISTRY }}
          username: ${{ secrets.QUARANTINE_READ_USERNAME }}
          password: ${{ secrets.QUARANTINE_READ_PASSWORD }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote exact tested digest without loading candidate image
        id: promote
        shell: bash
        env:
          QUARANTINE_REF: ${{ needs.validate-release.outputs.quarantine_ref }}
          EXPECTED_DIGEST: ${{ needs.validate-release.outputs.quarantine_digest }}
          RELEASE_SHA: ${{ needs.validate-release.outputs.sha }}
          VERSION: ${{ needs.validate-release.outputs.version }}
          RELEASE_TAG: ${{ needs.validate-release.outputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          source_ref="${QUARANTINE_REF%:*}@$EXPECTED_DIGEST"
          immutable_ref="$repository:sha-$RELEASE_SHA"
          docker buildx imagetools create --tag "$immutable_ref" "$source_ref"
          promoted="$(docker buildx imagetools inspect "$immutable_ref" --format '{{.Manifest.Digest}}')"
          test "$promoted" = "$EXPECTED_DIGEST"
          if [[ -n "$RELEASE_TAG" ]]; then
            test "$RELEASE_TAG" = "v$VERSION"
            version_ref="$repository:$VERSION"
            docker buildx imagetools create --tag "$version_ref" "$source_ref"
            tagged="$(docker buildx imagetools inspect "$version_ref" --format '{{.Manifest.Digest}}')"
            test "$tagged" = "$EXPECTED_DIGEST"
          fi
          echo "digest=$EXPECTED_DIGEST" >> "$GITHUB_OUTPUT"
          echo "subject_name=$repository" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-name: ${{ steps.promote.outputs.subject_name }}
          subject-digest: ${{ steps.promote.outputs.digest }}
          push-to-registry: true
