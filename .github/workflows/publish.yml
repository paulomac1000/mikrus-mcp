name: Publish container

# Release trust boundary (see SECURITY.md): the unprivileged validation stage
# builds, smokes, and pushes the candidate image to a quarantine registry and
# records the exact immutable digest. The protected publisher receives only
# that digest plus evidence and promotes it registry-to-registry. It has no
# candidate checkout and never loads, runs, or rebuilds candidate image bytes.
#
# TODO(provider): the quarantine push requires QUARANTINE_REGISTRY_USERNAME /
# QUARANTINE_REGISTRY_PASSWORD secrets scoped to write the
# <repository>-quarantine GHCR package namespace. Provisioning and exercising
# those credentials is a provider step outside repository-only work; the
# promotion identity itself is proven by the disposable-registry regression
# in tests/smoke/test_promotion_identity.py.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_ref:
        description: Existing v* tag or full 40-character commit SHA reachable from the default branch
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.ref }}
  cancel-in-progress: false

env:
  QUARANTINE_REGISTRY: ghcr.io
  QUARANTINE_REPOSITORY: ${{ github.repository }}-quarantine
  # TRUST TRANSITION (bootstrap): the protected publisher executes the
  # promoter script from the validated CI bundle ONLY after its SHA-256
  # matches this digest. The digest was established by the reviewed
  # integration of PR #34: the squash-merged master revision is the trust
  # root, its scripts/promote_digest.py bytes hash exactly to this value, and
  # the post-merge pin-affirmation re-verifies this binding. Any future
  # change to the promoter or to this digest is a promoter TRUST TRANSITION:
  # it must land through an independently reviewed commit on master, never
  # inside a candidate PR. A candidate that alters the script without such a
  # reviewed transition fails closed here, before any registry credential
  # exists.
  PROMOTER_CONTENT_SHA256: 6a0601e2947795c5721bb7caceb8555bdc2abff78916b1bda82e291ef6244ae1

jobs:
  validate-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
      version: ${{ steps.revision.outputs.version }}
      release_tag: ${{ steps.revision.outputs.release_tag }}
      artifact_id: ${{ steps.evidence.outputs.artifact_id }}
      quarantined_digest: ${{ steps.quarantine.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve and constrain release identity
        id: revision
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF_NAME: ${{ github.ref_name }}
          REQUESTED_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.ref }}
        run: |
          set -euo pipefail
          requested="$REQUESTED_REF"
          release_tag=""
          if [[ "$EVENT_NAME" == "push" ]]; then
            release_tag="$EVENT_REF_NAME"
            requested="refs/tags/$release_tag"
          fi
          if [[ "$requested" =~ ^[0-9a-f]{40}$ ]]; then
            release_sha="$requested"
          else
            case "$requested" in
              refs/tags/v*) release_tag="${requested#refs/tags/}" ;;
              v*) release_tag="$requested" ;;
              *) echo "release_ref must be an existing v* tag or full commit SHA" >&2; exit 1 ;;
            esac
            git show-ref --verify --quiet "refs/tags/$release_tag" || {
              echo "Tag not found: $release_tag" >&2
              exit 1
            }
            release_sha="$(git rev-parse "refs/tags/$release_tag^{commit}")"
          fi
          [[ "$release_sha" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$release_sha^{commit}"
          git merge-base --is-ancestor "$release_sha" "origin/$DEFAULT_BRANCH" || {
            echo "Selected revision is not reachable from origin/$DEFAULT_BRANCH" >&2
            exit 1
          }
          git checkout --detach "$release_sha"
          test "$(git rev-parse HEAD)" = "$release_sha"
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [[ -n "$release_tag" ]]; then
            test "$release_tag" = "v$version"
            test "$(git rev-parse "refs/tags/$release_tag^{commit}")" = "$release_sha"
          fi
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
      - name: Locate successful CI release bundle
        id: evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.revision.outputs.sha }}
        run: |
          set -euo pipefail
          run_id="$(gh api --paginate \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$RELEASE_SHA&status=success&per_page=100" \
            --jq '.workflow_runs | map(select(.head_sha == env.RELEASE_SHA)) | first | .id')"
          test -n "$run_id" && test "$run_id" != "null"
          artifact_id="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" \
            --jq ".artifacts | map(select(.name == \"release-bundle-$RELEASE_SHA\" and (.expired | not))) | first | .id")"
          test -n "$artifact_id" && test "$artifact_id" != "null"
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
      - name: Download exact CI artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.evidence.outputs.artifact_id }}
        run: |
          set -euo pipefail
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > release-bundle.zip
          mkdir bundle
          unzip -q release-bundle.zip -d bundle
      - name: Verify exact CI bundle and wheel transports
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.revision.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(cat bundle/release/commit-sha.txt)" = "$RELEASE_SHA"
          (cd bundle && sha256sum --check release/bundle-sha256.txt)
          python scripts/artifact_smoke.py \
            --wheel "$(find bundle/dist -maxdepth 1 -name 'mikrus_mcp-*.whl' -print -quit)" \
            --wheelhouse bundle/wheelhouse
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - name: Load and smoke candidate image outside protected publisher
        id: candidate
        shell: bash
        env:
          VERSION: ${{ steps.revision.outputs.version }}
        run: |
          set -euo pipefail
          loaded="$(docker load --input bundle/release/image.tar)"
          source_image="${loaded#Loaded image: }"
          test "$source_image" != "$loaded"
          image_id="$(docker image inspect --format='{{.Id}}' "$source_image")"
          test "$image_id" = "$(cat bundle/release/image-id.txt)"
          docker run --rm --entrypoint python "$source_image" -c \
            "import os; from mikrus_mcp import __version__; assert __version__ == '$VERSION'; assert os.getuid() == 10001"
          echo "image_id=$image_id" >> "$GITHUB_OUTPUT"
      - name: Push candidate to quarantine registry and record immutable digest
        id: quarantine
        shell: bash
        env:
          QUARANTINE_USERNAME: ${{ secrets.QUARANTINE_REGISTRY_USERNAME }}
          QUARANTINE_PASSWORD: ${{ secrets.QUARANTINE_REGISTRY_PASSWORD }}
          VERSION: ${{ steps.revision.outputs.version }}
        run: |
          set -euo pipefail
          test -n "$QUARANTINE_USERNAME" && test -n "$QUARANTINE_PASSWORD"
          quarantine_ref="$QUARANTINE_REGISTRY/${QUARANTINE_REPOSITORY,,}"
          echo "$QUARANTINE_PASSWORD" | docker login "$QUARANTINE_REGISTRY" \
            --username "$QUARANTINE_USERNAME" --password-stdin
          loaded="$(docker load --input bundle/release/image.tar)"
          source_image="${loaded#Loaded image: }"
          quarantine_tag="$quarantine_ref:candidate-$VERSION"
          docker tag "$source_image" "$quarantine_tag"
          docker push "$quarantine_tag"
          digest="$(docker buildx imagetools inspect "$quarantine_tag" --format '{{.Manifest.Digest}}')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker pull "$quarantine_ref@$digest"
          docker run --rm --entrypoint python "$quarantine_ref@$digest" -c \
            "import os; from mikrus_mcp import __version__; assert __version__ == '$VERSION'; assert os.getuid() == 10001"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "quarantine_ref=$quarantine_ref" >> "$GITHUB_OUTPUT"

  publish:
    needs: validate-release
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: none
      actions: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Download exact validated CI artifact (promoter bytes under trusted digest)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.validate-release.outputs.artifact_id }}
        run: |
          set -euo pipefail
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > release-bundle.zip
          mkdir bundle
          unzip -q release-bundle.zip -d bundle
      - name: Verify promoter bytes against the trusted digest before any credential use
        shell: bash
        env:
          EXPECTED_PROMOTER_SHA256: ${{ env.PROMOTER_CONTENT_SHA256 }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_PROMOTER_SHA256" =~ ^[0-9a-f]{64}$ ]]
          actual="$(sha256sum bundle/release/promote_digest.py | cut -d' ' -f1)"
          test "$actual" = "$EXPECTED_PROMOTER_SHA256" || {
            echo "promoter script bytes do not match the trusted digest; refusing" >&2
            exit 1
          }
          test "$(cat bundle/release/commit-sha.txt)" = "${{ needs.validate-release.outputs.sha }}"
          (cd bundle && sha256sum --check release/bundle-sha256.txt)
      - name: Promote exact tested digest registry-to-registry without candidate bytes
        id: copy
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.validate-release.outputs.sha }}
          QUARANTINED_DIGEST: ${{ needs.validate-release.outputs.quarantined_digest }}
          VERSION: ${{ needs.validate-release.outputs.version }}
          RELEASE_TAG: ${{ needs.validate-release.outputs.release_tag }}
          SOURCE_REGISTRY_USERNAME: ${{ secrets.QUARANTINE_REGISTRY_USERNAME }}
          SOURCE_REGISTRY_PASSWORD: ${{ secrets.QUARANTINE_REGISTRY_PASSWORD }}
          DESTINATION_REGISTRY_USERNAME: ${{ github.actor }}
          DESTINATION_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$QUARANTINED_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          tags=(--tag "sha-$RELEASE_SHA")
          if [[ -n "$RELEASE_TAG" ]]; then
            test "$RELEASE_TAG" = "v$VERSION"
            tags+=(--tag "$VERSION")
          fi
          python3 bundle/release/promote_digest.py \
            --source-ref "$QUARANTINE_REGISTRY/${QUARANTINE_REPOSITORY,,}" \
            --digest "$QUARANTINED_DIGEST" \
            --expected-digest "$QUARANTINED_DIGEST" \
            --destination-ref "ghcr.io/${GITHUB_REPOSITORY,,}" \
            "${tags[@]}"
      - name: Independently verify production tags resolve to the promoted digest
        id: promote
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.validate-release.outputs.sha }}
          QUARANTINED_DIGEST: ${{ needs.validate-release.outputs.quarantined_digest }}
          VERSION: ${{ needs.validate-release.outputs.version }}
          RELEASE_TAG: ${{ needs.validate-release.outputs.release_tag }}
          DESTINATION_REGISTRY_USERNAME: ${{ github.actor }}
          DESTINATION_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tags=("sha-$RELEASE_SHA")
          if [[ -n "$RELEASE_TAG" ]]; then
            tags+=("$VERSION")
          fi
          python3 bundle/release/promote_digest.py \
            --verify-only \
            --digest "$QUARANTINED_DIGEST" \
            --destination-ref "ghcr.io/${GITHUB_REPOSITORY,,}" \
            $(printf ' --tag %s' "${tags[@]}")
          echo "digest=$QUARANTINED_DIGEST" >> "$GITHUB_OUTPUT"
          echo "subject_name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-name: ${{ steps.promote.outputs.subject_name }}
          subject-digest: ${{ steps.promote.outputs.digest }}
          push-to-registry: true

  release:
    if: needs.validate-release.outputs.release_tag != ''
    needs: [validate-release, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.validate-release.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Create GitHub Release from changelog
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate-release.outputs.release_tag }}
          VERSION: ${{ needs.validate-release.outputs.version }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["VERSION"]
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          marker = f"## [{version}]"
          start = text.index(marker)
          tail = text[start:]
          next_release = tail.find("\n## [", len(marker))
          section = tail if next_release == -1 else tail[:next_release]
          Path("release-notes.md").write_text(section.strip() + "\n", encoding="utf-8")
          PY
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub Release already exists: $RELEASE_TAG"
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "mikrus-mcp $VERSION" \
            --notes-file release-notes.md
