name: Agent source snapshot

on:
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/agent-source-snapshot.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-source-snapshot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Create source archive
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git --exclude=source-snapshot.tar.gz -czf source-snapshot.tar.gz .
      - name: Upload source archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: agent-source-snapshot-${{ github.run_id }}
          path: source-snapshot.tar.gz
          if-no-files-found: error
          retention-days: 1
