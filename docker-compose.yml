services:
  mikrus-mcp:
    build:
      context: .
    env_file: .env
    stdin_open: true
    tty: false
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Streamable HTTP is loopback-only inside the container. Publishing a host
    # port requires a separately reviewed network and authentication profile.
